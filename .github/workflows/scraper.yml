name: RoTrends Scraper

on:
  # GitHub Actions cron is UTC: every 6 hours at minute 17.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: scraper-group
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  scrape:
    # Live collection is gated by a read-only Supabase authorization/RPC preflight.
    # HTTP 402, database outages, bad routes or unexpected responses stop before
    # Chromium starts or the source cursor can advance.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # A queued dispatch can point at a commit older than the prior run's cursor.
          # Resolve main when this serialized job starts, not when it was dispatched.
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run scraper unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify Supabase database authorization path
        env:
          SUPABASE_URL: https://xxuwqkscmxhjgibuhpwc.supabase.co
        run: python scripts/preflight_supabase.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ensure browsers are installed
        run: python -m playwright install --with-deps chromium
      - name: Collect into Scoutbase
        # Leave time within the existing 10-minute job for committing checkpoints.
        timeout-minutes: 8
        env:
          MAX_PAGES: '3'
          RUN_BUDGET_SECONDS: '420'
        run: python bot.py
      - name: Save collection cursor
        if: ${{ always() }}
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add scan_cursor.json
          if [ -f identity_cache.json ]; then git add identity_cache.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Scoutbase collection cursor"
          git pull --rebase origin main
          git push
