name: Scraper Unit Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, improve/scouting-reliability]
    paths: [bot.py, requirements.txt, 'tests/**', .github/workflows/tests.yml]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
