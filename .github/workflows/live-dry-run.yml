name: Live RoTrends Dry Run
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scrape-without-side-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Inspect two pages without delivery or state changes
        env:
          DRY_RUN: 'true'
          MAX_PAGES: '2'
        run: python bot.py
